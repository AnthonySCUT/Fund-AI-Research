name: Scheduled fund research

on:
  workflow_dispatch:
  schedule:
    # 07:30 Beijing time, Monday-Friday (23:30 UTC on Sunday-Thursday).
    - cron: "30 23 * * 0-4"
    # 12:00 and 15:30 Beijing time, Monday-Friday.
    - cron: "0 4 * * 1-5"
    - cron: "30 7 * * 1-5"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch, validate and analyze
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_BASE_URL: ${{ secrets.GROK_BASE_URL }}
          GROK_MODEL: ${{ secrets.GROK_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          LLM_TIMEOUT_SECONDS: "20"
        run: python scripts/scheduled_research.py
      - name: Commit latest snapshot
        shell: bash
        run: |
          git config user.name "fund-ai-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_research.json data/latest_research.md
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "Update scheduled research snapshot"
            git push
          fi
